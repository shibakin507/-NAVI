<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <title>Mt.Fuji 3DMap Generator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/three@0.147.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.147.0/examples/js/controls/TrackballControls.js"></script>

    <style>
        body { margin: 0; display: flex; flex-direction: row; height: 100vh; font-family: sans-serif; overflow: hidden; background: #1a1a1a; color: #fff; }
        @media screen and (max-width: 768px) {
            body { flex-direction: column; }
            #map-container { width: 100% !important; height: 40% !important; border-right: none !important; border-bottom: 1px solid #444; }
            #webgl-container { width: 100% !important; height: 60% !important; }
            .panel { width: 140px !important; padding: 8px !important; font-size: 10px !important; }
        }
        #map-container { width: 40%; height: 100%; position: relative; border-right: 1px solid #444; }
        #map { width: 100%; height: 100%; }
        #webgl-container { width: 60%; height: 100%; position: relative; }
        #webgl { width: 100%; height: 100%; }
        .panel { position: absolute; top: 10px; left: 10px; z-index: 1000; background: rgba(0,0,0,0.8); padding: 12px; border-radius: 8px; width: 180px; border: 1px solid #444; }
        .btn-main { background: #e67e22; color: white; border: none; padding: 8px; width: 100%; cursor: pointer; border-radius: 4px; font-weight: bold; margin-bottom: 8px; }
        label { display: block; margin-bottom: 3px; color: #aaa; font-size: 10px; }
        input[type="range"] { width: 100%; }
        #status { color: #f1c40f; font-weight: bold; display: none; margin-bottom: 5px; }
    </style>
</head>
<body>

<div id="map-container">
    <div id="map"></div>
    <div class="panel">
        <div id="status">生成中...</div>
        <button class="btn-main" onclick="start3DRender()">3D表示</button>
        <p style="margin:0; font-size:9px;">地図を動かして範囲を選択</p>
    </div>
</div>

<div id="webgl-container">
    <div id="webgl"></div>
    <div class="panel" style="top: auto; bottom: 40px;">
        <label>高さ: <span id="hVal">0.02</span></label>
        <input id="hSlide" type="range" min="0" max="0.08" step="0.001" value="0.02" oninput="update3D()">
        <label>標高色: <span id="o1Val">0.50</span></label>
        <input id="o1Slide" type="range" min="0" max="1" step="0.01" value="0.50" oninput="update3D()">
        <label>陰影: <span id="o2Val">0.50</span></label>
        <input id="o2Slide" type="range" min="0" max="1" step="0.01" value="0.50" oninput="update3D()">
    </div>
</div>

<script>
var map, rect, scene, camera, renderer, controls, terrainMesh, terrainMaterial, rawHeights = [];

function initMap() {
    map = L.map('map').setView([35.3606, 138.7273], 12);
    L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png').addTo(map);
    rect = L.rectangle([[35.37, 138.71], [35.35, 138.74]], {color: "#e67e22", fillOpacity: 0.1, weight: 2}).addTo(map);
    map.on('move', () => {
        var c = map.getCenter(), z = map.getZoom(), d = 0.02 * Math.pow(2, 13 - z);
        rect.setBounds([[c.lat + d, c.lng - d * 1.2], [c.lat - d, c.lng + d * 1.2]]);
    });
}

function initThree() {
    var el = document.getElementById("webgl");
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(el.clientWidth, el.clientHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    el.appendChild(renderer.domElement);
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a1a);
    scene.add(new THREE.AmbientLight(0xffffff, 1.5));
    camera = new THREE.PerspectiveCamera(45, el.clientWidth/el.clientHeight, 0.1, 10000);
    camera.position.set(0, -200, 200);
    camera.up.set(0, 0, 1);
    controls = new THREE.TrackballControls(camera, renderer.domElement);
    renderLoop();
}

function renderLoop() {
    requestAnimationFrame(renderLoop);
    if(controls) controls.update();
    renderer.render(scene, camera);
}

function start3DRender() {
    document.getElementById("status").style.display = "block";
    var b = rect.getBounds(), z = 13;
    var x1 = Math.floor((b.getWest() + 180) / 360 * Math.pow(2, z));
    var y1 = Math.floor((1 - Math.log(Math.tan(b.getNorth() * Math.PI / 180) + 1 / Math.cos(b.getNorth() * Math.PI / 180)) / Math.PI) / 2 * Math.pow(2, z));
    var x2 = Math.floor((b.getEast() + 180) / 360 * Math.pow(2, z));
    var y2 = Math.floor((1 - Math.log(Math.tan(b.getSouth() * Math.PI / 180) + 1 / Math.cos(b.getSouth() * Math.PI / 180)) / Math.PI) / 2 * Math.pow(2, z));
    
    var tx = x2 - x1 + 1, ty = y2 - y1 + 1;
    var cvs = document.createElement("canvas"); cvs.width = tx * 256; cvs.height = ty * 256;
    var ctx = cvs.getContext("2d"), count = 0, total = tx * ty;

    for(let x = x1; x <= x2; x++){
        for(let y = y1; y <= y2; y++){
            let img = new Image(); img.crossOrigin = "anonymous";
            img.onload = () => {
                ctx.drawImage(img, (x-x1)*256, (y-y1)*256);
                if(++count === total) build3D(ctx, cvs.width, cvs.height, x1, y1, x2, y2, z);
            };
            img.src = `https://cyberjapandata.gsi.go.jp/xyz/dem_png/${z}/${x}/${y}.png`;
        }
    }
}

function build3D(demCtx, w, h, x1, y1, x2, y2, z) {
    if(terrainMesh) { scene.remove(terrainMesh); terrainMesh.geometry.dispose(); terrainMesh.material.dispose(); }
    var data = demCtx.getImageData(0, 0, w, h).data;
    var segW = Math.min(w-1, 120), segH = Math.min(h-1, 120);
    var geom = new THREE.PlaneGeometry(150, 150 * (h/w), segW, segH);
    rawHeights = [];
    var pos = geom.attributes.position.array;
    for (let i = 0; i < geom.attributes.position.count; i++) {
        let ix = Math.floor((i % (segW + 1)) * (w / (segW + 1)));
        let iy = Math.floor(Math.floor(i / (segW + 1)) * (h / (segH + 1)));
        let p = (iy * w + ix) * 4;
        let v = data[p]*65536 + data[p+1]*256 + data[p+2];
        let hgt = (v < 8388608) ? v * 0.01 : (v - 16777216) * 0.01;
        rawHeights.push(hgt);
        pos[i*3+2] = hgt * 0.02;
    }
    geom.computeVertexNormals();

    loadTextures(x1, y1, x2, y2, z, (tex0, tex1, tex2) => {
        terrainMaterial = new THREE.MeshPhongMaterial({ map: tex0, side: THREE.DoubleSide });
        terrainMaterial.onBeforeCompile = (shader) => {
            shader.uniforms.overlay1 = { value: tex1 };
            shader.uniforms.overlay2 = { value: tex2 };
            shader.uniforms.opacity1 = { value: 0.5 };
            shader.uniforms.opacity2 = { value: 0.5 };
            terrainMaterial.userData.shader = shader;
            
            // 安全のために改行を追加して結合
            shader.fragmentShader = `
                uniform sampler2D overlay1;
                uniform sampler2D overlay2;
                uniform float opacity1;
                uniform float opacity2;
            \n` + shader.fragmentShader;

            shader.fragmentShader = shader.fragmentShader.replace(
                '#include <map_fragment>',
                `#include <map_fragment>\n
                vec4 col1 = texture2D(overlay1, vUv);
                vec4 col2 = texture2D(overlay2, vUv);
                diffuseColor.rgb = mix(diffuseColor.rgb, col1.rgb, opacity1);
                diffuseColor.rgb = mix(diffuseColor.rgb, diffuseColor.rgb * col2.rgb, opacity2);`
            );
        };
        terrainMesh = new THREE.Mesh(geom, terrainMaterial);
        scene.add(terrainMesh);
        geom.computeBoundingSphere();
        controls.target.copy(geom.boundingSphere.center);
        camera.position.set(geom.boundingSphere.center.x, geom.boundingSphere.center.y - 150, 150);
        document.getElementById("status").style.display = "none";
        update3D();
    });
}

function loadTextures(x1, y1, x2, y2, z, callback) {
    var tx = x2 - x1 + 1, ty = y2 - y1 + 1;
    var types = ["std", "relief", "hillshademap"];
    var results = [];
    var loadedTypes = 0;

    types.forEach((type, idx) => {
        let cvs = document.createElement("canvas"); cvs.width = tx*256; cvs.height = ty*256;
        let ctx = cvs.getContext("2d"), count = 0;
        for(let x = x1; x <= x2; x++){
            for(let y = y1; y <= y2; y++){
                let img = new Image(); img.crossOrigin = "anonymous";
                img.onload = () => {
                    ctx.drawImage(img, (x-x1)*256, (y-y1)*256);
                    if(++count === tx*ty) {
                        results[idx] = new THREE.CanvasTexture(cvs);
                        if(++loadedTypes === 3) callback(results[0], results[1], results[2]);
                    }
                };
                img.src = `https://cyberjapandata.gsi.go.jp/xyz/${type}/${z}/${x}/${y}.png`;
            }
        }
    });
}

function update3D() {
    if (!terrainMesh) return;
    var h = parseFloat(document.getElementById("hSlide").value);
    var o1 = parseFloat(document.getElementById("o1Slide").value);
    var o2 = parseFloat(document.getElementById("o2Slide").value);
    document.getElementById("hVal").innerText = h.toFixed(3);
    document.getElementById("o1Val").innerText = o1.toFixed(2);
    document.getElementById("o2Val").innerText = o2.toFixed(2);
    var pos = terrainMesh.geometry.attributes.position.array;
    for (let i = 0; i < rawHeights.length; i++) { pos[i*3+2] = rawHeights[i] * h; }
    terrainMesh.geometry.attributes.position.needsUpdate = true;
    if (terrainMaterial.userData.shader) {
        terrainMaterial.userData.shader.uniforms.opacity1.value = o1;
        terrainMaterial.userData.shader.uniforms.opacity2.value = o2;
    }
}

window.onload = () => { initMap(); initThree(); };
window.onresize = () => {
    map.invalidateSize();
    var el = document.getElementById("webgl");
    renderer.setSize(el.clientWidth, el.clientHeight);
    camera.aspect = el.clientWidth/el.clientHeight;
    camera.updateProjectionMatrix();
};
</script>
</body>
</html>
