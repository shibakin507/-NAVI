/* ---------- マークポイント読込( 外部CSVファイルから ) ---------- */
    function createGeoCsv(url, defaultIcon) {

        const layer = L.geoCsv(null, {
            titles: ['lat', 'lng', 'icon', 'popup'],
            firstLineTitles: false,
            fieldSeparator: ',',

            onEachFeature: (feature, layer) => {
                layer.bindPopup(feature.properties.popup);
            },

            pointToLayer: (feature, latlng) => {
                return L.marker(latlng, {
                    icon: L.icon({
                        iconUrl: feature.properties.icon || defaultIcon,
                        shadowUrl: 'marker/shadow.png',
                        iconSize: [25, 41],
                        iconAnchor: [10, 43],
                        shadowSize: [41, 41],
                        shadowAnchor: [10, 43]
                    })
                });
            }
        });

        $.ajax({
            beforeSend: xhr => {
                xhr.overrideMimeType('text/csv;charset=UTF-8');
            },
            type: 'GET',
            dataType: 'text',
            url: url
        }).done(data => layer.addData(data));

        return layer;
    }

/* ---------- 河川監視カメラ（富士土木）CGI対応   ---------- */

function createLiveCamMarker(lat, lng, camId, title) {

  const imgId = "cam_" + Math.random().toString(36).substr(2, 9);

  const popup = `
    <div style="width:260px;">
      <div style="text-align:center; font-size:14px; margin-bottom:4px;">
        ${title}
      </div>
      <img id="${imgId}" width="260" height="180">
    </div>
  `;

  const marker = L.marker([lat, lng]).bindPopup(popup, {
    maxWidth: "auto"
  });

  marker.on("popupopen", () => {

    function getLatestUrl() {

      const now = new Date();

      // 2分戻す
      now.setMinutes(now.getMinutes() - 2);

      // 2分単位に丸める
      const minute = now.getMinutes();
      const roundedMinute = Math.floor(minute / 2) * 2;
      now.setMinutes(roundedMinute);
      now.setSeconds(0);

      const YYYY = now.getFullYear();
      const MM = String(now.getMonth() + 1).padStart(2, '0');
      const DD = String(now.getDate()).padStart(2, '0');
      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');

      const timestamp = `${YYYY}${MM}${DD}${hh}${mm}00`;

      return `https://www.cam.shizuoka4.jp/cam/${camId}/${YYYY}/${MM}/${DD}/${timestamp}_01.jpg`;
    }

    function updateImage() {
      const img = document.getElementById(imgId);
      if (img) {
        img.src = getLatestUrl() + "?t=" + Date.now();
      }
    }

    updateImage();

    const timer = setInterval(updateImage, 60000);

    marker.on("popupclose", () => {
      clearInterval(timer);
    }, { once: true });

  });

  return marker;
}
