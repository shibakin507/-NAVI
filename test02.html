<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>

<title></title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://shibakin507.github.io/-NAVI/dist/leaflet.geocsv.js"></script>

<style>
html, body, #mapcontainer {
    height: 100%;
    margin: 0;
}

/* ===== 画像拡大オーバーレイ ===== */
#imgOverlay {
    display: none;
    position: fixed;
    z-index: 9999;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.9);
    justify-content: center;
    align-items: center;
}

#imgOverlay img {
    max-width: 95%;
    max-height: 95%;
}
</style>
</head>

<body>
<div id="mapcontainer"></div>

<!-- 画像拡大 -->
<div id="imgOverlay" onclick="this.style.display='none'">
  <img id="overlayImg">
</div>

<script>

let map;

/* ===============================
   初期化
=============================== */
function init() {

    map = L.map('mapcontainer', {
        zoomControl: false
    }).setView([35.3366, 138.7326], 13);

    const osm = L.tileLayer(
        'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
        { maxZoom: 18 }
    ).addTo(map);

    /* ===============================
       CSV読み込み
    =============================== */
    function createGeoCsv(url) {

        const layer = L.geoCsv(null, {
            titles: ['lat', 'lng', 'icon', 'popup'],
            firstLineTitles: false,
            fieldSeparator: ',',

            onEachFeature: (feature, layer) => {
                layer.bindPopup(feature.properties.popup);
            },

            pointToLayer: (feature, latlng) => {
                return L.marker(latlng);
            }
        });

        $.get(url, data => layer.addData(data));

        return layer;
    }

    /* ===============================
       ライブカメラ
    =============================== */
    function createLiveCamMarker(lat, lng, camId, title) {

        const imgId = "cam_" + Math.random().toString(36).substr(2, 9);

        const popup = `
          <div style="width:260px;">
            <div style="text-align:center;">${title}</div>
            <img id="${imgId}" width="260" height="180" style="cursor:pointer;">
          </div>
        `;

        const marker = L.marker([lat, lng]).bindPopup(popup);

        marker.on("popupopen", () => {

            function getUrl() {
                const now = new Date();
                now.setMinutes(now.getMinutes() - 2);

                const YYYY = now.getFullYear();
                const MM = String(now.getMonth()+1).padStart(2,'0');
                const DD = String(now.getDate()).padStart(2,'0');
                const hh = String(now.getHours()).padStart(2,'0');
                const mm = String(Math.floor(now.getMinutes()/2)*2).padStart(2,'0');

                return `https://www.cam.shizuoka4.jp/cam/${camId}/${YYYY}/${MM}/${DD}/${YYYY}${MM}${DD}${hh}${mm}00_01.jpg`;
            }

            const img = document.getElementById(imgId);

            function update(){
                img.src = getUrl() + "?t=" + Date.now();
            }

            update();
            const timer = setInterval(update, 60000);

            marker.on("popupclose", () => clearInterval(timer), {once:true});
        });

        return marker;
    }

    /* ===============================
       カメラ配置
    =============================== */
    const cams = [
        {lat:35.28735,lng:138.587,id:"2017",title:"上条カメラ"},
        {lat:35.2411,lng:138.5946,id:"2099",title:"淀師カメラ"}
    ];

    const camLayer = L.layerGroup();
    cams.forEach(c=>{
        camLayer.addLayer(createLiveCamMarker(c.lat,c.lng,c.id,c.title));
    });

    /* ===============================
       CSVレイヤー
    =============================== */
    const csvLayer = createGeoCsv('data/newrivercam.csv');

    /* ===============================
       レイヤー
    =============================== */
    L.control.layers(null, {
        "ライブカメラ": camLayer,
        "CSVカメラ": csvLayer
    }).addTo(map);

    /* ===============================
       🔥 ここが重要（全画像対応）
    =============================== */
    enablePopupImageZoom();
}

/* ===============================
   🔥 全ポップアップ画像拡大
=============================== */
function enablePopupImageZoom() {

    map.on("popupopen", function(e) {

        const popupEl = e.popup.getElement();
        if (!popupEl) return;

        const images = popupEl.querySelectorAll("img");

        images.forEach(img => {

            img.style.cursor = "pointer";

            img.onclick = () => {
                const overlay = document.getElementById("imgOverlay");
                const overlayImg = document.getElementById("overlayImg");

                overlayImg.src = img.src;
                overlay.style.display = "flex";
            };
        });
    });
}

init();

</script>
</body>
</html>
