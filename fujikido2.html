<!DOCTYPE html>
<html lang="ja">
<head>

<title>富士軌道NAVI</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<link rel="stylesheet" href="https://shibakin507.github.io/-NAVI/dist/L.Control.Locate.min.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.locatecontrol/dist/L.Control.Locate.min.js"></script>
<script src="https://unpkg.com/leaflet-rotate@0.2.8/dist/leaflet-rotate.js"></script>

<style>
html, body, #mapcontainer {
    height: 100%;
    margin: 0;
}

.leaflet-compass,
.leaflet-control-rotate {
    display: none !important;
}

@keyframes pulseArrow {
    0% { transform: scale(1); filter: drop-shadow(0 0 0px red); }
    50% { transform: scale(1.28); filter: drop-shadow(0 0 14px red); }
    100% { transform: scale(1); filter: drop-shadow(0 0 0px red); }
}
.arrow-svg.pulsing {
    animation: pulseArrow 1.1s ease-in-out infinite;
    transform-origin: center;
}


/* ===== 画像モーダル ===== */
.image-modal {
    display: none;
    position: fixed;
    z-index: 9999;
    inset: 0;
    background: rgba(0,0,0,0.88);
    justify-content: center;
    align-items: center;
    padding: 10px;
}

.image-modal.active {
    display: flex;
}

.image-modal img {
    max-width: 95%;
    max-height: 85%;
    border-radius: 12px;
}

/* ===== 閉じるボタン ===== */
.modal-close {
    position: absolute;
    top: 15px;
    right: 20px;
    font-size: 28px;
    color: white;
    background: rgba(0,0,0,0.5);
    border-radius: 50%;
    width: 42px;
    height: 42px;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    user-select: none;
}

.modal-close:active {
    transform: scale(0.9);
}


</style>
</head>

<body>
<div id="mapcontainer"></div>

<script>
let map;
let myMarker = null;
let currentBearing = 0;
const smooth = 0.15;
let isLocateActive = false;

/* ---------- 現在地アイコン ---------- */
const myArrowIcon = L.divIcon({
    className: '',
    html: `
    <svg class="arrow-svg" width="36" height="48" viewBox="0 0 60 100">
        <polygon points="34,8 58,100 34,84 10,100" fill="rgba(0,0,0,0.5)"/>
        <polygon points="30,2 56,98 30,80 4,98" fill="#ffffff"/>
        <polygon id="myArrow" points="30,6 52,94 30,78 8,94" fill="#ff0000"/>
    </svg>`,
    iconSize: [24, 36],
    iconAnchor: [12, 18]
});

/* ---------- 初期化 ---------- */
function init() {

    map = L.map('mapcontainer', {
        zoomControl: false,
        rotate: true,
        bearing: 0
    }).setView([35.28, 138.615], 13);

    /* ===== ベース地図 ===== */
    const gsiPhoto = L.tileLayer(
        'https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg',
        { attribution: "地理院地図（衛星）", maxZoom: 18 }
    );

    const osm = L.tileLayer(
        'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
        { attribution: "© OpenStreetMap contributors", maxZoom: 19 }
    ).addTo(map);

    const baseMaps = {
        "国土地理院（衛星）": gsiPhoto,
        "OpenStreetMap": osm
    };

   /* ===== コース画像（オーバーレイ） ===== */
const overlays = {};
const courseData = [
    {
        name: "富士軌道の路線跡",
        file: "fujikido.jpg",
        bounds: [[35.403288, 138.582337], [35.214560, 138.650]],
        opacity: 1.0
    },

////////////////追加する場合/////////////////////
/*  {
        name: "第二コース",
        file: "course2.jpg",
        bounds: [[35.39, 138.58], [35.23, 138.66]],
        opacity: 0.6
    },
    {
        name: "テストコースA",
        file: "trialA.png",
        bounds: [[35.37, 138.60], [35.25, 138.64]],
        opacity: 0.8
    }
*/
/////////////////////////////////////////////////

];


courseData.forEach(c => {
    const layer = L.imageOverlay(
        `data/${c.file}`,
        c.bounds,
        { opacity: c.opacity }
    );


if (c.name === "富士軌道の路線跡") {
        layer.addTo(map);   // ← ★デフォルト時に表示させる
    }

    overlays[c.name] = layer;
});



///////////マークポイント1////////////////

const pointIcon = L.icon({
    iconUrl: 'marker/red.png',   // ポイント画像
    iconSize: [25, 41],
    iconAnchor: [10, 43],
    shadowUrl: 'marker/shadow.png',
    shadowSize: [41, 41],
    shadowAnchor: [10, 43]
});


const pointData = [

    },

    },

　   {

    },

        lng: 138.618300,

    },

    { 
        lat: 35.268292, 
        lng: 138.615661, 
        name: "【蒲沢】",

    },

    { 
        lat: 35.275405,

　//　　　img: "images/.jpg"
 　 },

    {  lat: 35.280695, 
        lng: 138.609009, 
        name: "【峰】",
  //      img: "images/.jpg"
    },

    {   lat: 35.286300, 
        lng: 138.607507,

    },

    {   lat: 35.295828, 
        lng: 138.602432,

    },

        lng: 138.634372, 
        name: "【判立場】<BR><BR>三期線の終点駅",
    //    img: "images/.jpg"
    },
    
];

const pointLayer1 = L.layerGroup();

pointData.forEach(p => {

    let popupContent;

    if (p.img) {
        popupContent = `
            <div style="text-align:center;">
                ${p.name}
                <br><br>
                <img src="${p.img}" 
                     style="width:150px;height:110px;object-fit:cover;border-radius:8px;cursor:pointer;"
                     onclick="openImage('${p.img}')">

                    ※タップで拡大
                </div>
            </div>
        `;
    } else {
        popupContent = `
            <div style="text-align:center;">
                ${p.name}
                <br><br>
                <div style="font-size:13px;color:#888;">
                    画像は準備中です
                </div>
            </div>
        `;
    }

    L.marker([p.lat, p.lng], { icon: pointIcon })
        .bindPopup(popupContent, { maxWidth: 250 })
        .addTo(pointLayer1);
});

pointLayer1.addTo(map);   // ★ デフォルトON
overlays["駅の位置"] = pointLayer1;

////////////////////////////////////////

const pointIcon2 = L.icon({
    iconUrl: 'marker/yellow.png',   
    iconSize: [25, 41],
    iconAnchor: [10, 43],
    shadowUrl: 'marker/shadow.png',
    shadowSize: [41, 41],
    shadowAnchor: [10, 43]
});



const pointData2 = [
    { 
     lat: 35.233145, 
     lng: 138.611932, 
     name: "【明治の曲り松】<BR><BR>行違い複線区域<BR>口コミ情報による場所は<BR>「浅間大社裏手」",
     img: "images/magarimatsu.jpg"
     },

    { 
     lat: 35.233404, 
     lng: 138.612345, 
     name: "【現在の曲り松】<BR><BR>行違い複線区域<BR>口コミ情報による場所は<BR>「浅間大社裏手」",
     img: "images/newmagarimatsu.jpg"
     },

    { 
     lat: 35.254254, 
     lng: 138.616739, 
     name: "【万野の三角地】<BR><BR>行違い複線区域<BR>口コミ情報による場所は<BR>「浅間大社裏手」",
     img: "images/mannotriangle.jpg"
     },

    { 
     lat: 35.306860, 
     lng: 138.594723, 
     name: "【上井出歴史広場】<BR><BR>行違い複線区域<BR>口コミ情報による場所は<BR>「浅間大社裏手」",
     img: "images/k_historypark.jpg"
     },

    { 
     lat: 35.307276, 
     lng: 138.594326, 
     name: "【築堤と橋台】<BR><BR>行違い複線区域<BR>口コミ情報による場所は<BR>「浅間大社裏手」",
     img: "images/chikutei.jpg"
     },

    { 
     lat: 35.338181, 
     lng: 138.593988, 
     name: "【駒立観音】<BR><BR>行違い複線区域<BR>口コミ情報による場所は<BR>「浅間大社裏手」",
     img: "images/komadatekannon.jpg"
     },

    { 
     lat: 35.387511, 
     lng: 138.634758, 
     name: "【供養塔】<BR><BR>行違い複線区域<BR>口コミ情報による場所は<BR>「浅間大社裏手」",
 //    img: "images/.jpg"
     },

];


const pointLayer2 = L.layerGroup();


pointData2.forEach(p => {

    let popupContent;

    if (p.img) {
        popupContent = `
            <div style="text-align:center;">
                ${p.name}
                <br><br>
                <img src="${p.img}" 
                     style="width:150px;height:110px;object-fit:cover;border-radius:8px;cursor:pointer;"
                     onclick="openImage('${p.img}')">
                <div style="font-size:12px;color:#666;margin-top:6px;">
                    ※タップで拡大
                </div>
            </div>
        `;
    } else {
        popupContent = `
            <div style="text-align:center;">
                ${p.name}
                <br><br>
                <div style="font-size:13px;color:#888;">
                    画像は準備中です
                </div>
            </div>
        `;
    }

    L.marker([p.lat, p.lng], { icon: pointIcon2 })
        .bindPopup(popupContent, { maxWidth: 250 })
        .addTo(pointLayer2);
});





//pointLayer2.addTo(map);   // ★ デフォルトOFF
overlays["見所ポイント"] = pointLayer2;




    /* ===== レイヤー切替UI ===== */
    L.control.layers(baseMaps, overlays, {
        position: "topright",
        collapsed: false
    }).addTo(map);

    L.control.scale({ imperial: false }).addTo(map);

    /* ===== GPS（Locate） ===== */

　　




    const lc = L.control.locate({
    　position: "topleft",
    　drawMarker: false,      // ← これが最重要
    　drawCircle: false,
    　showCompass: false,     // ← これを追加
    　watch: true,
    　setView: 'once',
    　locateOptions: { enableHighAccuracy: true }
　　}).addTo(map);



    


　　function setArrowColor(color) {
    　　const arrow = myMarker?.getElement()?.querySelector('#myArrow');
    　　if (!arrow) return;
    　　arrow.setAttribute('fill', color);
　　}



　　map.on('locateactivate', () => {
    　　isLocateActive = true;
    　　setArrowColor('#ff0000');   // 赤
    　　requestOrientationPermission();
　　});

    map.on('locatedeactivate', () => {
        isLocateActive = false;
        setArrowPulse(false);
　　　　setArrowColor('#888888');   // グレー
    });





map.on('locationfound', e => {

    if (!myMarker) {
        myMarker = L.marker(e.latlng, { icon: myArrowIcon }).addTo(map);
    } else {
        myMarker.setLatLng(e.latlng);
    }

    // ★ ここが超重要
    if (isLocateActive) {
        setArrowColor('#ff0000');   // GPS ONなら赤
    } else {
        setArrowColor('#888888');   // GPS OFFならグレー
    }

    setArrowPulse(true);
});


    

}

/* ---------- 鼓動 ---------- */
function setArrowPulse(on) {
    const svg = myMarker?.getElement()?.querySelector('.arrow-svg');
    if (!svg) return;
    svg.classList.toggle('pulsing', on);
}

/* ---------- 方位センサー ---------- */
function requestOrientationPermission() {
    if (typeof DeviceOrientationEvent?.requestPermission === "function") {
        DeviceOrientationEvent.requestPermission().then(res => {
            if (res === 'granted')
                window.addEventListener('deviceorientation', handleOrientation, true);
        });
    } else {
        window.addEventListener('deviceorientationabsolute', handleOrientation, true);
    }
}

function handleOrientation(e) {
    let heading = e.webkitCompassHeading || e.alpha;
    if (!heading) return;
    const diff = ((heading - currentBearing + 540) % 360) - 180;
    currentBearing += diff * smooth;
    map.setBearing(currentBearing);
}

init();



/* ===== 画像拡大機能 ===== */

function openImage(src) {
    const modal = document.getElementById("imageModal");
    const modalImg = document.getElementById("modalImage");
    modalImg.src = src;
    modal.classList.add("active");
}

function closeImage() {
    document.getElementById("imageModal").classList.remove("active");
}

/* 背景クリックでも閉じる */
document.getElementById("imageModal").addEventListener("click", function (e) {
    if (e.target.id === "imageModal") {
        closeImage();
    }
});


</script>

<!-- 画像拡大用モーダル -->
<div id="imageModal" class="image-modal">
    <div class="modal-close" onclick="closeImage()">✕</div>
    <img id="modalImage">
</div>

</body>
</html>
