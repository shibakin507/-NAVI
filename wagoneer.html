<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>

<title>富士山に放置されたGrand Wagoneer</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<link rel="stylesheet" href="https://shibakin507.github.io/-NAVI/dist/L.Control.Locate.min.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.locatecontrol/dist/L.Control.Locate.min.js"></script>
<script src="https://unpkg.com/leaflet-rotate@0.2.8/dist/leaflet-rotate.js"></script>

<style>
/* =============================
   基本レイアウト
============================= */
html, body, #mapcontainer {
    height: 100%;
    margin: 0;
}

/* 回転UIは非表示 */
.leaflet-compass,
.leaflet-control-rotate {
    display: none !important;
}

/* =============================
   現在地アイコンの鼓動アニメーション
============================= */
@keyframes pulseArrow {
    0% { transform: scale(1); filter: drop-shadow(0 0 0px red); }
    50% { transform: scale(1.28); filter: drop-shadow(0 0 14px red); }
    100% { transform: scale(1); filter: drop-shadow(0 0 0px red); }
}
.arrow-svg.pulsing {
    animation: pulseArrow 1.1s ease-in-out infinite;
    transform-origin: center;
}

/* =============================
   画像モーダル
============================= */
.image-modal {
    display: none;
    position: fixed;
    z-index: 9999;
    inset: 0;
    background: rgba(0,0,0,0.88);
    justify-content: center;
    align-items: center;
    padding: 10px;
}

.image-modal.active {
    display: flex;
}

.image-modal img {
    max-width: 95%;
    max-height: 85%;
    border-radius: 12px;
}

/* ===== 閉じるボタン ===== */
.modal-close {
    position: absolute;
    top: 15px;
    right: 20px;
    font-size: 28px;
    color: white;
    background: rgba(0,0,0,0.5);
    border-radius: 50%;
    width: 42px;
    height: 42px;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    user-select: none;
}

.modal-close:active {
    transform: scale(0.9);
}


</style>
</head>

<body>
<div id="mapcontainer"></div>

<script>
/* ==========================================================
   グローバル変数
========================================================== */
let map;
let myMarker = null;
let currentBearing = 0;
const smooth = 0.15;
let isLocateActive = false;

/* ==========================================================
   現在地アイコン（SVG矢印）
========================================================== */

const myArrowIcon = L.divIcon({
    className: '',
    html: `
    <svg class="arrow-svg" width="36" height="48" viewBox="0 0 60 100">
        <polygon points="34,8 58,100 34,84 10,100" fill="rgba(0,0,0,0.5)"/>
        <polygon points="30,2 56,98 30,80 4,98" fill="#ffffff"/>
        <polygon id="myArrow" points="30,6 52,94 30,78 8,94" fill="#ff0000"/>
    </svg>`,
    iconSize: [24, 36],
    iconAnchor: [12, 18]
});



/* ==========================================================
   初期化
========================================================== */
function init() {
    
    /* ---------- 地図生成 ---------- */
    map = L.map('mapcontainer', {
        zoomControl: false,
        rotate: true,
        bearing: 0
    }).setView([35.35154, 138.76977], 15);

    /* ---------- ベース地図 ---------- */

var gsiattr = "<a href='https://maps.gsi.go.jp/development/ichiran.html' target='_blank'>地理院タイル</a>";
    

    const gsi = L.tileLayer(
        'http://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', 
        { attribution: gsiattr, maxZoom: 18 }
    ).addTo(map);

    const gsiPhoto = L.tileLayer(
        'https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg',
        { attribution: gsiattr, maxZoom: 18 }
    );

　　const osm = L.tileLayer(
        'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
        { attribution: "© OpenStreetMap contributors", maxZoom: 19 }
    );



    const baseMaps = {
        "地理院地図(標準)": gsi,
        "地理院衛星写真": gsiPhoto,
　　　　"OpenStreetMap": osm
    };


/* ======================================================
       コース画像オーバーレイ
    ====================================================== */

const overlays = {};

/* ---------- マーカーの生成 ------------- */

const pointIcon = L.icon({
    iconUrl: 'marker/red.png',   
    iconSize: [25, 41],
    iconAnchor: [10, 43],
    shadowUrl: 'marker/shadow.png',
    shadowSize: [41, 41],
    shadowAnchor: [10, 43]
});


const pointData = [

    { 
     lat: 35.3515471, 
     lng: 138.7697721, 
     name: "【 Grand Wagoneer 】",
     //img: "images/wagoneer.jpg"
     },

/* ===============================
    { 
     lat: 35.3515471, 
     lng: 138.7697721, 
     name: "【 Grand Wagoneer 】",
     img: "images/point2.jpg"
     },
=============================== */

];


const pointLayer = L.layerGroup();


pointData.forEach(p => {

    let popupContent;

    if (p.img) {
        popupContent = `
            <div style="text-align:center;">
                ${p.name}
                <br><br>
                <img src="${p.img}" 
                     style="width:150px;height:110px;object-fit:cover;border-radius:8px;cursor:pointer;"
                     onclick="openImage('${p.img}')">
                <div style="font-size:12px;color:#666;margin-top:6px;">
                    ※タップで拡大
                </div>
            </div>
        `;
    } else {
        popupContent = `
            <div style="text-align:center;">
                ${p.name}
                <br><br>
                <div style="font-size:13px;color:#888;">
                    画像は準備中です
                </div>
            </div>
        `;
    }

    L.marker([p.lat, p.lng], { icon: pointIcon })
        .bindPopup(popupContent, { maxWidth: 250 })
        .addTo(pointLayer);
});


pointLayer.addTo(map);   // ★ デフォルトON
overlays["Grabd Wagoneer"] = pointLayer;


/* ======================================================
       UIコンテナ配置
    ====================================================== */

/* ---------- レイヤーコンテナ ------------- */

    L.control.layers(baseMaps, overlays, {
        position: "topleft",
        collapsed: true //コンテナへ格納
    }).addTo(map);

/* ---------- 地図スケール ------------- */

    L.control.scale({
        position: "bottomright",
　　　　imperial: false
　　 }).addTo(map);

/* ---------- GPSスイッチ ------------- */

    L.control.locate({
    　position: "topright",
    　drawMarker: false,      // ← これが最重要
    　drawCircle: false,
    　showCompass: false,     // ← これを追加
    　watch: true,
    　setView: 'once',
      initialZoomLevel: 14 ,
    　locateOptions: { enableHighAccuracy: true }
    }).addTo(map);


/* ======================================================
       GPS（Locate）
    ====================================================== */

/* ---------- 現在地アイコン制御 ------------- */
    
function setArrowColor(color) {
    const arrow = myMarker?.getElement()?.querySelector('#myArrow');
    if (!arrow) return;
    arrow.setAttribute('fill', color);
}


map.on('locateactivate', () => {
    isLocateActive = true;
    setArrowColor('#ff0000');   // 赤
    requestOrientationPermission();
});

map.on('locatedeactivate', () => {
    isLocateActive = false;
    setArrowPulse(false);
setArrowColor('#888888');   // グレー
    });


map.on('locationfound', e => {

    if (!myMarker) {
        myMarker = L.marker(e.latlng, { icon: myArrowIcon }).addTo(map);
    } else {
        myMarker.setLatLng(e.latlng);
    }

    // ★ ここが超重要
    if (isLocateActive) {
        setArrowColor('#ff0000');   // GPS ONなら赤
    } else {
        setArrowColor('#888888');   // GPS OFFならグレー
    }

    setArrowPulse(true);
});

}

/* ---------- 現在地アイコンの鼓動 ---------- */
function setArrowPulse(on) {
    const svg = myMarker?.getElement()?.querySelector('.arrow-svg');
    if (!svg) return;
    svg.classList.toggle('pulsing', on);
}

/* ==========================================================
   方位センサー
========================================================== */
function requestOrientationPermission() {
    if (typeof DeviceOrientationEvent?.requestPermission === "function") {
        DeviceOrientationEvent.requestPermission().then(res => {
            if (res === 'granted')
                window.addEventListener('deviceorientation', handleOrientation, true);
        });
    } else {
        window.addEventListener('deviceorientationabsolute', handleOrientation, true);
    }
}

function handleOrientation(e) {
    let heading = e.webkitCompassHeading || e.alpha;
    if (!heading) return;
    const diff = ((heading - currentBearing + 540) % 360) - 180;
    currentBearing += diff * smooth;
    map.setBearing(currentBearing);
}

/* ---------- 起動 ---------- */

init();

/* ==========================================================
   画像拡大機能
========================================================== */

function openImage(src) {
    const modal = document.getElementById("imageModal");
    const modalImg = document.getElementById("modalImage");
    modalImg.src = src;
    modal.classList.add("active");
}

function closeImage() {
    document.getElementById("imageModal").classList.remove("active");
}

/* 背景クリックでも閉じる */
document.getElementById("imageModal").addEventListener("click", function (e) {
    if (e.target.id === "imageModal") {
        closeImage();
    }
});

</script>

<!-- 画像拡大用モーダル -->
<div id="imageModal" class="image-modal">
    <div class="modal-close" onclick="closeImage()">✕</div>
    <img id="modalImage">
</div>

</body>
</html>
