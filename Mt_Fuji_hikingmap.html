<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>

<title>Mt.FUJIハイキングマップNAVI</title>

<link rel="stylesheet" href="dist/leaflet.css" />
<script src="dist/jquery.min.js"></script>
<script src="dist/leaflet.js"></script>
<link rel="stylesheet" href="dist/L.Control.Locate.min.css" />
<script src="dist/L.Control.Locate.min.js"></script>
<script src="dist/leaflet-rotate.js"></script>
<script src="dist/leaflet.geocsv.js"></script>







<style>
/* =============================
   基本レイアウト
============================= */
html, body, #mapcontainer {
    height: 100%;
    margin: 0;
}

/* 回転UIは非表示 */
.leaflet-compass,
.leaflet-control-rotate {
    display: none !important;
}

/* =============================
   現在地アイコンの鼓動アニメーション
============================= */
@keyframes pulseArrow {
    0% { transform: scale(1); filter: drop-shadow(0 0 0px red); }
    50% { transform: scale(1.28); filter: drop-shadow(0 0 14px red); }
    100% { transform: scale(1); filter: drop-shadow(0 0 0px red); }
}
.arrow-svg.pulsing {
    animation: pulseArrow 1.1s ease-in-out infinite;
    transform-origin: center;
}



</style>






</head>

<body>
<div id="mapcontainer"></div>

<script>
/* ==========================================================
   グローバル変数
========================================================== */
let map;
let myMarker = null;
let currentBearing = 0;
const smooth = 0.15;
let isLocateActive = false;

/* ==========================================================
   現在地アイコン（SVG矢印）
========================================================== */

const myArrowIcon = L.divIcon({
    className: '',
    html: `
    <svg class="arrow-svg" width="36" height="48" viewBox="0 0 60 100">
        <polygon points="34,8 58,100 34,84 10,100" fill="rgba(0,0,0,0.5)"/>
        <polygon points="30,2 56,98 30,80 4,98" fill="#ffffff"/>
        <polygon id="myArrow" points="30,6 52,94 30,78 8,94" fill="#ff0000"/>
    </svg>`,
    iconSize: [24, 36],
    iconAnchor: [12, 18]
});



/* ==========================================================
   初期化
========================================================== */
function init() {
    
    /* ---------- 地図生成 ---------- */
    map = L.map('mapcontainer', {
        zoomControl: false,
        rotate: true,
        bearing: 0
    }).setView([35.3366, 138.7326], 13);

    /* ---------- ベース地図 ---------- */

var gsiattr = "<a href='https://maps.gsi.go.jp/development/ichiran.html' target='_blank'>地理院タイル</a>";
    

    const gsi = L.tileLayer(
        'https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', 
        { attribution: gsiattr, maxZoom: 18 }
    ).addTo(map);

    const gsiPhoto = L.tileLayer(
        'https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg',
        { attribution: gsiattr, maxZoom: 18 }
    );

　　const osm = L.tileLayer(
        'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
        { attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors', maxZoom: 18 }
    );

    const google = L.tileLayer(
        'https://mt1.google.com/vt/lyrs=r&x={x}&y={y}&z={z}', 
        { attribution: "<a href='https://developers.google.com/maps/documentation' target='_blank'>Google Map</a>"}
    );



/* ---------- オーバーレイ地図 ---------- */

    const gsirehillshademap = L.tileLayer(
        'http://cyberjapandata.gsi.go.jp/xyz/hillshademap/{z}/{x}/{y}.png', 
        { opacity: 1.0, maxNativeZoom: 16, attribution: gsiattr }
    );

    const bounds = L.latLngBounds( 
    　　[35.3905, 138.6706] , [35.2745, 138.8222]
    );

    const kyuyourin = L.imageOverlay(
        'data/kyuyourin.jpg', bounds, { opacity: 0.7, maxNativeZoom: 18 }
    );


/* ---------- マークポイント読込( 外部CSVファイルから ) ---------- */
    function createGeoCsv(url, defaultIcon) {

        const layer = L.geoCsv(null, {
            titles: ['lat', 'lng', 'icon', 'popup'],
            firstLineTitles: false,
            fieldSeparator: ',',

            onEachFeature: (feature, layer) => {
                layer.bindPopup(feature.properties.popup);
            },

            pointToLayer: (feature, latlng) => {
                return L.marker(latlng, {
                    icon: L.icon({
                        iconUrl: feature.properties.icon || defaultIcon,
                        shadowUrl: 'marker/shadow.png',
                        iconSize: [25, 41],
                        iconAnchor: [10, 43],
                        shadowSize: [41, 41],
                        shadowAnchor: [10, 43]
                    })
                });
            }
        });

        $.ajax({
            beforeSend: xhr => {
                xhr.overrideMimeType('text/csv;charset=UTF-8');
            },
            type: 'GET',
            dataType: 'text',
            url: url
        }).done(data => layer.addData(data));

        return layer;
    }


/* ---------- マークポイント読込( html書き込データみから) ---------- */

// 複数ポイントの配列（緯度, 経度, 表示名）
const points = [{
                 lat: 35.335993,
                 lng: 138.800261, 
                name: "<center>太郎坊からの富士山<br>Copyright (c)  国土交通省・富士砂防事務所<br>\
                       ((((( 現在カメラ調整中です )))))\
                       <img src='https://www.cbr.mlit.go.jp/fujisabo/camera/images/00032.jpg' width= '240' height='140' >\
                       </center> " 
                 },

　              { 
                 lat: 35.305214,
                 lng: 138.776137,
                name: "<center>片蓋山からの富士山<br>Copyright (c)  国土交通省・富士砂防事務所 <br>\
                       <img src='https://www.cbr.mlit.go.jp/fujisabo/camera/images/00039.jpg' width= '240' height='140' >\
                       </center>" 
                 },

                {
                 lat: 35.306629, 
                 lng: 138.771921, 
                name: "<center>水ヶ塚 / 富士公園太郎坊線<br>Copyright (c) 静岡県・富士土木事務所<br>\
                       <img src='http://fujilive.pref.shizuoka.jp/fuji/02_mizugazuka/mobile_cam_mizugazuka.jpg' width= '240' height='140' >\
                       <img src= 'http://fujilive.pref.shizuoka.jp/fuji/02_mizugazuka/mobile_temp_mizugazuka.gif' width= '30' height='140' >\
                       </center>"
                 },

                { 
                 lat: 35.302614,
                 lng: 138.749986, 
                name: "<center>二合目/ 富士宮冨士公園線<br>Copyright (c) 静岡県・富士土木事務所<br>\
                       <img src='http://fujilive.pref.shizuoka.jp/fuji/03_fujinomiya/mobile_cam_fujinomiya.jpg' width= '240' height='140' >\
                       <img src= 'http://fujilive.pref.shizuoka.jp/fuji/03_fujinomiya/mobile_temp_fujinomiya.gif' width= '30' height='140' >\
                       </center>" 
                 },
                
                {
                 lat: 35.221958,
                 lng: 138.621798, 
                name: "<center>富士宮市役所からの富士山<br>Copyright (c) 富士宮市 <br>\
                      <div style='width:320px;height:300px;overflow:hidden;'>\
                        <div style='transform:scale(0.55); transform-origin: top left;'>\
                          <div style='width:550px;height:530px;overflow:hidden;position:relative;'>\
                          <iframe src='https://www.fujinomiya-camera.jp/livecam.htm' \
                          style='position:absolute;top:-270px;left:-400px;width:1200px;height:900px;border:none;'>\
                          </iframe>\
                          </div>\
                        </div>\
                      </div>\
                      </center>"
                },
];



// オリジナルアイコンの設定

const cameraIcon = L.icon({
    iconUrl: 'marker/camera.png',
    iconSize: [25, 41],
    iconAnchor: [10, 43],
    shadowUrl: 'marker/shadow.png',
    shadowSize: [41, 41],
    shadowAnchor: [10, 43]
});


// マーカーを LayerGroupにまとめる

const LiveCamera = L.layerGroup();

points.forEach(p => {
  const marker = L.marker([p.lat, p.lng], {icon: cameraIcon}).bindPopup(p.name);
  LiveCamera.addLayer(marker);
});


/* ---------- レイヤーコンテナの中身 ------------- */

    const baseMaps = {
        "地理院地図(標準)": gsi,
        "地理院衛星写真": gsiPhoto,
　　　　"OpenStreetMap": osm,
        "Google Map": google
    };
　　const overlays = {
        "Mt.FUJIハイキングマップ": kyuyourin,
        "地図の起伏を強調する": gsirehillshademap,
        "360度パノラマ写真を見る": createGeoCsv('data/newfujiforest.csv', ''),
        "ライブカメラを見る": LiveCamera ,
    };

kyuyourin.addTo(map);   // ★ デフォルトON

/* ======================================================
       UIコンテナ配置
    ====================================================== */

/* ---------- レイヤーコンテナ ------------- */

    L.control.layers(baseMaps, overlays, {
        position: "topleft",
        collapsed: true //コンテナへ格納
    }).addTo(map);

/* ---------- 地図スケール ------------- */

    L.control.scale({
        position: "bottomright",
　　　　imperial: false
　　 }).addTo(map);

/* ---------- GPSスイッチ ------------- */

    L.control.locate({
    　position: "topright",
    　drawMarker: false,      // ← これが最重要
    　drawCircle: false,
    　showCompass: false,     // ← これを追加
    　watch: true,
    　setView: 'once',
      initialZoomLevel: 14 ,
    　locateOptions: { enableHighAccuracy: true }
    }).addTo(map);


/* ======================================================
       GPS（Locate）
    ====================================================== */

/* ---------- 現在地アイコン制御 ------------- */
    
function setArrowColor(color) {
    const arrow = myMarker?.getElement()?.querySelector('#myArrow');
    if (!arrow) return;
    arrow.setAttribute('fill', color);
}


map.on('locateactivate', () => {
    isLocateActive = true;
    setArrowColor('#ff0000');   // 赤
    requestOrientationPermission();
});

map.on('locatedeactivate', () => {
    isLocateActive = false;
    setArrowPulse(false);
setArrowColor('#888888');   // グレー
    });


map.on('locationfound', e => {

    if (!myMarker) {
        myMarker = L.marker(e.latlng, { icon: myArrowIcon }).addTo(map);
    } else {
        myMarker.setLatLng(e.latlng);
    }

    // ★ ここが超重要
    if (isLocateActive) {
        setArrowColor('#ff0000');   // GPS ONなら赤
    } else {
        setArrowColor('#888888');   // GPS OFFならグレー
    }

    setArrowPulse(true);
});

}

/* ---------- 現在地アイコンの鼓動 ---------- */
function setArrowPulse(on) {
    const svg = myMarker?.getElement()?.querySelector('.arrow-svg');
    if (!svg) return;
    svg.classList.toggle('pulsing', on);
}

/* ==========================================================
   方位センサー
========================================================== */
function requestOrientationPermission() {
    if (typeof DeviceOrientationEvent?.requestPermission === "function") {
        DeviceOrientationEvent.requestPermission().then(res => {
            if (res === 'granted')
                window.addEventListener('deviceorientation', handleOrientation, true);
        });
    } else {
        window.addEventListener('deviceorientationabsolute', handleOrientation, true);
    }
}

function handleOrientation(e) {
    let heading = e.webkitCompassHeading || e.alpha;
    if (!heading) return;
    const diff = ((heading - currentBearing + 540) % 360) - 180;
    currentBearing += diff * smooth;
    map.setBearing(currentBearing);
}

/* ---------- 起動 ---------- */

init();

</script>


</body>
</html>
