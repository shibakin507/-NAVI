<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="keywords" content="富士宮市歩く博物館,歩く博物館,3D地図,立体地図,富士山,富士宮市">
    <meta name="description" content="「富士宮市歩く博物館 3D Terrain Generator」は国土地理院の地図タイルを利用して富士宮市が企画制作した歩く博物館のパンフレットを3D立体地図に変換するWEBアプリです。">

    <title>富士宮市歩く博物館 3D Terrain Generator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    
    <script src="dist/three.min.js"></script>
    <script src="dist/TrackballControls.js"></script>

    <style>
        body { margin: 0; padding: 0; height: 100vh; font-family: sans-serif; overflow: hidden; background: #1a1a1a; color: #fff; }
        
        #webgl-container { width: 100%; height: 100%; position: relative; }
        #webgl { width: 100%; height: 100%; }
        
        .panel {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 2500; 
            background: rgba(0,0,0,0.85);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #444;
            width: 180px;
            box-sizing: border-box;
        }

        .flex-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 4px;
            margin-bottom: 6px;
        }

        .btn-main {
            background: #e67e22;
            color: white;
            border: none;
            padding: 4px 8px; 
            width: 100%;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
            font-size: 12px; 
            box-sizing: border-box;
            height: 28px;
            line-height: 18px;
            text-align: center;
        }
        .btn-main:hover { background: #d35400; }
        
        .control-item { margin-top: 8px; width: 100%; }
        label { display: block; margin-bottom: 2px; color: #aaa; font-size: 10.5px; }
        .val-text { color: #fff; float: right; font-weight: bold; }
        input[type="range"] { width: 100%; cursor: pointer; accent-color: #e67e22; margin: 0; height: 16px; }
        
        select { 
            width: 100%; 
            box-sizing: border-box; 
            background: #333; 
            color: #fff; 
            border: 1px solid #555; 
            font-size: 11px;
            padding: 4px 2px; 
            border-radius: 3px; 
            cursor: pointer;
            text-overflow: ellipsis;
        }
        select option {
            font-size: 12px;
            background: #222;
            color: #fff;
        }
        
        #status { color: #f1c40f; font-weight: bold; display: none; margin-bottom: 8px; text-align: center; font-size: 11px; }

        .credit-text {
            position: absolute;
            bottom: 5px;
            right: 10px;
            z-index: 1001;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body>

<div id="webgl-container">
    <div id="webgl"></div>

    <div class="panel"> 
        <div id="status">生成中...</div>
        
        <div class="control-item" style="margin-top: 0; margin-bottom: 8px;">
            <label>⭐コースを選択してください</label>
            <select id="courseSelect" onchange="onCourseChange()"></select>
        </div>

        <div class="flex-row">
            <button class="btn-main" onclick="start3DRender()">3D表示</button>
        </div>

        <hr style="border: 0; border-top: 1px solid #444; margin: 8px 0;">

        <div class="control-item">
            <label>コース図の透過度: <span id="o3Val" class="val-text">0.60</span></label>
            <input id="o3Slide" type="range" min="0" max="1" step="0.01" value="0.60" oninput="update3D()">
        </div>
    </div>
    
    <div class="credit-text">
        <a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" style="color: #fff; text-decoration: underline;">地理院タイル</a> / <a href="https://www.city.fujinomiya.lg.jp/3010400000/p001925.html" target="_blank" style="color: #fff; text-decoration: underline;">富士宮市歩く博物館</a> / <a href="http://fujisanwalker.blog.fc2.com/blog-entry-443.html" target="_blank" style="color: #fff; text-decoration: underline;">富士山Walker</a>
    </div>
</div>

<script>
const courseData = [
    { name: "A.猪之頭 / 湧水を活かした産業", file: "data/inogashira.jpg", bounds: [[35.3795, 138.5556], [35.3591, 138.5729]] },
    { name: "B.上野 / 石造物をたずねる", file: "data/ueno.jpg", bounds: [[35.2919, 138.5609], [35.2671, 138.5832]] },
    { name: "C.上井出・白糸 / 富士の巻狩", file: "data/kamiide.jpg", bounds: [[35.3295, 138.5780], [35.2935, 138.6099]] },
    { name: "D.富士根北 / 道者道を歩く", file: "data/nekita.jpg", bounds: [[35.2752, 138.6432], [35.2436, 138.6705]] },
    { name: "E.北山 / 中道往還の旧道を歩く", file: "data/kitayama.jpg", bounds: [[35.2982, 138.5907], [35.2681, 138.6170]] },
    { name: "F.富丘 / 風祭の里を歩く", file: "data/tomioka.jpg", bounds: [[35.2522, 138.5815], [35.2276, 138.6027]] },
    { name: "G.泉・野中 / 飢渇川から潤井川", file: "data/izumi.jpg", bounds: [[35.2306, 138.5949], [35.2139, 138.6093]] },
    { name: "H.大宮西 / 旧大宮町西地区をめぐる", file: "data/westomiya.jpg", bounds: [[35.2396, 138.5981], [35.2208, 138.6145]] },
    { name: "H.大宮東 / 東大宮町東地区をめぐる", file: "data/eastomiya.jpg", bounds: [[35.2404, 138.6050], [35.2133, 138.6282]] },
    { name: "I.富士根南 / 泉と古墳をたずねる", file: "data/fujine.jpg", bounds: [[35.2403, 138.6251], [35.2135, 138.6483]] },
    { name: "J.黒田・星山 / 星山の手ひきと倭文神社", file: "data/hoshiyama.jpg", bounds: [[35.2211, 138.6011], [35.1951, 138.6230]] },
    { name: "K.白糸 / 昔話の里を歩く", file: "data/shiraito.jpg", bounds: [[35.3340, 138.5645], [35.3040, 138.5910]] },
    { name: "L.杉田 / 狸寺と子安神社をたずねる", file: "data/sugita.jpg", bounds: [[35.23451, 138.6449], [35.2078, 138.6679]] },
    { name: "M.山宮 / 山宮浅間神社と御神幸道", file: "data/yamamiya.jpg", bounds: [[35.2861, 138.6170], [35.2548, 138.6437]] },
    { name: "N.万野原新田 / 万野原開墾の歴史", file: "data/manno.jpg", bounds: [[35.2683, 138.6083], [35.2409, 138.6318]] },
    { name: "O.安居山 / 安沼用水の里を歩く", file: "data/agoyama.jpg", bounds: [[35.2293, 138.5767], [35.1975, 138.6041]] },
    { name: "P.沼久保 / 渡船と舟運の跡をたずねる", file: "data/numakubo.jpg", bounds: [[35.2070, 138.5814], [35.1884, 138.5976]] },
    { name: "Q.黒田・山本 / 山本勘助と俳人梅市の里", file: "data/kuroda.jpg", bounds: [[35.2237, 138.6107], [35.1970, 138.6336]] },
    { name: "R.上稲子 / 平家落人伝説の里をたずねる", file: "data/kamiinago.jpg", bounds: [[35.2836, 138.5172], [35.2504, 138.5455]] },
    { name: "S.上柚野・猫沢 / 柚野の里をめぐる北", file: "data/yuno.jpg", bounds: [[35.2793, 138.5470], [35.2529, 138.5698]] },
    { name: "T.下柚野・大鹿窪 / 柚野の里をめぐる南", file: "data/yuno2.jpg", bounds: [[35.2637, 138.5506], [35.2404, 138.5707]] },
    { name: "U.西山・大久保 / 西山本門寺をたずねる", file: "data/nishiyama.jpg", bounds: [[35.2480, 138.5499], [35.2139, 138.5791]] },
    { name: "V.羽鮒・長貫 / 富士川の歴史", file: "data/habuna.jpg", bounds: [[35.2134, 138.5526], [35.1866, 138.5757]] },
    { name: "W.内房 / 内房の里を歩く", file: "data/utsubusa.jpg", bounds: [[35.2135, 138.5375], [35.1830, 138.5630]] }
];

var scene, camera, renderer, controls, terrainMesh, terrainMaterial, rawHeights = [];
var selectedImage = new Image();
var currentCourse = null;        

const FIXED_H = 0.03;  
const FIXED_O1 = 0.00;  
const FIXED_O2 = 1.00;  

function initControlPanel() {
    var select = document.getElementById("courseSelect");
    courseData.forEach((course, index) => {
        var opt = document.createElement("option");
        opt.value = index;
        opt.innerText = course.name;
        select.appendChild(opt);
    });
    onCourseChange();
}

function onCourseChange() {
    var index = document.getElementById("courseSelect").value;
    currentCourse = courseData[index];
    
    selectedImage = new Image();
    selectedImage.crossOrigin = "anonymous";
    var url = currentCourse.file;
    
    if (url.indexOf("https://", 8) !== -1) {
        url = url.substring(url.indexOf("https://", 8));
    }
    selectedImage.src = url;
}

function initThree() {
    var el = document.getElementById("webgl");
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(el.clientWidth, el.clientHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.85;
    el.appendChild(renderer.domElement);
    
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a1a);

    scene.add(new THREE.AmbientLight(0xffffff, 0.5));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(100, -100, 200);
    scene.add(dirLight);

    camera = new THREE.PerspectiveCamera(45, el.clientWidth / el.clientHeight, 1, 15000);
    camera.position.set(0, -250, 250);
    camera.up.set(0, 0, 1);
    
    controls = new THREE.TrackballControls(camera, renderer.domElement);
    renderLoop();
}

function renderLoop() {
    requestAnimationFrame(renderLoop);
    if (controls) controls.update();
    renderer.render(scene, camera);
}

function latLngToTileRelative(lat, lng, z, x1, y1) {
    var pixelX = (lng + 180) / 360 * Math.pow(2, z) * 256;
    var pixelY = (1 - Math.log(Math.tan(lat * Math.PI / 180) + 1 / Math.cos(lat * Math.PI / 180)) / Math.PI) / 2 * Math.pow(2, z) * 256;
    var originX = x1 * 256;
    var originY = y1 * 256;
    return { x: pixelX - originX, y: pixelY - originY };
}

function start3DRender() {
    if (!currentCourse || !selectedImage.src) return;

    document.getElementById("status").style.display = "block";
    
    var nwLat = currentCourse.bounds[0][0];
    var nwLng = currentCourse.bounds[0][1];
    var seLat = currentCourse.bounds[1][0];
    var seLng = currentCourse.bounds[1][1];
    
    var z = 14; 
    var x1 = Math.floor((nwLng + 180) / 360 * Math.pow(2, z));
    var y1 = Math.floor((1 - Math.log(Math.tan(nwLat * Math.PI / 180) + 1 / Math.cos(nwLat * Math.PI / 180)) / Math.PI) / 2 * Math.pow(2, z));
    var x2 = Math.floor((seLng + 180) / 360 * Math.pow(2, z));
    var y2 = Math.floor((1 - Math.log(Math.tan(seLat * Math.PI / 180) + 1 / Math.cos(seLat * Math.PI / 180)) / Math.PI) / 2 * Math.pow(2, z));

    var tx_count = x2 - x1 + 1, ty_count = y2 - y1 + 1;
    if (tx_count * ty_count > 120) z = 13; 
    
    x1 = Math.floor((nwLng + 180) / 360 * Math.pow(2, z));
    y1 = Math.floor((1 - Math.log(Math.tan(nwLat * Math.PI / 180) + 1 / Math.cos(nwLat * Math.PI / 180)) / Math.PI) / 2 * Math.pow(2, z));
    x2 = Math.floor((seLng + 180) / 360 * Math.pow(2, z));
    y2 = Math.floor((1 - Math.log(Math.tan(seLat * Math.PI / 180) + 1 / Math.cos(seLat * Math.PI / 180)) / Math.PI) / 2 * Math.pow(2, z));
    tx_count = x2 - x1 + 1; 
    ty_count = y2 - y1 + 1;

    var cvs = document.createElement("canvas"); 
    cvs.width = tx_count * 256; 
    cvs.height = ty_count * 256;
    var ctx = cvs.getContext("2d"), count = 0, total = tx_count * ty_count;

    for (let x = x1; x <= x2; x++) {
        for (let y = y1; y <= y2; y++) {
            let img = new Image(); 
            img.crossOrigin = "anonymous";
            img.onload = () => {
                ctx.drawImage(img, (x - x1) * 256, (y - y1) * 256);
                if (++count === total) build3D(ctx, cvs.width, cvs.height, x1, y1, x2, y2, z);
            };
            img.src = `https://cyberjapandata.gsi.go.jp/xyz/dem_png/${z}/${x}/${y}.png`;
        }
    }
}

function build3D(demCtx, w, h, x1, y1, x2, y2, z) {
    if (terrainMesh) { 
        scene.remove(terrainMesh); 
        terrainMesh.geometry.dispose(); 
        terrainMaterial.dispose(); 
    }

    var data = demCtx.getImageData(0, 0, w, h).data;
    var seg = 126;
    var geom = new THREE.PlaneGeometry(200, 200 * (h / w), seg, seg);
    rawHeights = [];
    var pos = geom.attributes.position.array;

    for (let i = 0; i < geom.attributes.position.count; i++) {
        let ix = Math.floor((i % (seg + 1)) * (w / (seg + 1)));
        let iy = Math.floor(Math.floor(i / (seg + 1)) * (h / (seg + 1)));
        let p = (iy * w + ix) * 4;
        let v = data[p] * 65536 + data[p + 1] * 256 + data[p + 2];
        let hgt = (v < 8388608) ? v * 0.01 : (v - 16777216) * 0.01;
        rawHeights.push(hgt);
        pos[i * 3 + 2] = hgt * FIXED_H; 
    }
    geom.computeVertexNormals();

    loadTextures(x1, y1, x2, y2, z, (tex0, tex1, tex2, tex3) => {
        terrainMaterial = new THREE.MeshPhongMaterial({ map: tex0, side: THREE.DoubleSide });
        
        terrainMaterial.onBeforeCompile = (shader) => {
            shader.uniforms.overlay1 = { value: tex1 };
            shader.uniforms.overlay2 = { value: tex2 };
            shader.uniforms.overlay3 = { value: tex3 };
            shader.uniforms.opacity1 = { value: FIXED_O1 }; 
            shader.uniforms.opacity2 = { value: FIXED_O2 }; 
            shader.uniforms.opacity3 = { value: parseFloat(document.getElementById("o3Slide").value) };
            terrainMaterial.userData.shader = shader;
            
            shader.fragmentShader = `uniform sampler2D overlay1; uniform sampler2D overlay2; uniform sampler2D overlay3; uniform float opacity1; uniform float opacity2; uniform float opacity3;\n` + shader.fragmentShader;
            shader.fragmentShader = shader.fragmentShader.replace('#include <map_fragment>', `
                #include <map_fragment>
                vec4 reliefCol = texture2D(overlay1, vUv);
                vec4 shadeCol  = texture2D(overlay2, vUv);
                vec4 customCol = texture2D(overlay3, vUv);

                vec3 base = diffuseColor.rgb;
                base = mix(base, reliefCol.rgb, opacity1);
                base *= mix(vec3(1.0), shadeCol.rgb, opacity2);
                base = mix(base, customCol.rgb, opacity3);

                diffuseColor.rgb = base;
            `);
        };

        terrainMesh = new THREE.Mesh(geom, terrainMaterial);
        scene.add(terrainMesh);
        document.getElementById("status").style.display = "none";
        update3D();
        
        geom.computeBoundingSphere();
        controls.target.copy(geom.boundingSphere.center);
        camera.position.set(geom.boundingSphere.center.x, geom.boundingSphere.center.y - 200, 200);
    });
}

function loadTextures(x1, y1, x2, y2, z, callback) {
    var tx = x2 - x1 + 1;
    var ty = y2 - y1 + 1;
    var layers = ["std", "relief", "hillshademap", "custom"];
    var texs = [], loaded = 0;

    layers.forEach((lyr, idx) => {
        let cvs = document.createElement("canvas");
        
        if (lyr === "custom") {
            var scale = 3; 
            cvs.width = tx * 256 * scale;
            cvs.height = ty * 256 * scale;
            let ctx = cvs.getContext("2d");

            if (currentCourse && selectedImage.src) {
                var nwLat = currentCourse.bounds[0][0];
                var nwLng = currentCourse.bounds[0][1];
                var seLat = currentCourse.bounds[1][0];
                var seLng = currentCourse.bounds[1][1];

                var pNW = latLngToTileRelative(nwLat, nwLng, z, x1, y1);
                var pSE = latLngToTileRelative(seLat, seLng, z, x1, y1);

                ctx.drawImage(selectedImage, pNW.x * scale, pNW.y * scale, (pSE.x - pNW.x) * scale, (pSE.y - pNW.y) * scale);
            }
            texs[idx] = new THREE.CanvasTexture(cvs);
            if (++loaded === 4) callback(texs[0], texs[1], texs[2], texs[3]);
            return;
        }

        cvs.width = tx * 256;
        cvs.height = ty * 256;
        let ctx = cvs.getContext("2d");
        let count = 0;
        for (let x = x1; x <= x2; x++) {
            for (let y = y1; y <= y2; y++) {
                let img = new Image();
                img.crossOrigin = "anonymous";
                img.onload = () => {
                    ctx.drawImage(img, (x - x1) * 256, (y - y1) * 256);
                    if (++count === tx * ty) {
                        texs[idx] = new THREE.CanvasTexture(cvs);
                        if (++loaded === 4) callback(texs[0], texs[1], texs[2], texs[3]);
                    }
                };
                img.src = `https://cyberjapandata.gsi.go.jp/xyz/${lyr}/${z}/${x}/${y}.png`;
            }
        }
    });
}

function update3D() {
    if (!terrainMesh) return;
    var o3 = parseFloat(document.getElementById("o3Slide").value);
    document.getElementById("o3Val").innerText = o3.toFixed(2);
    
    var pos = terrainMesh.geometry.attributes.position.array;
    for (let i = 0; i < rawHeights.length; i++) { 
        pos[i * 3 + 2] = rawHeights[i] * FIXED_H; 
    }
    terrainMesh.geometry.attributes.position.needsUpdate = true;
    
    if (terrainMaterial.userData.shader) {
        terrainMaterial.userData.shader.uniforms.opacity1.value = FIXED_O1;
        terrainMaterial.userData.shader.uniforms.opacity2.value = FIXED_O2;
        terrainMaterial.userData.shader.uniforms.opacity3.value = o3;
    }
}

window.onload = () => { 
    initControlPanel(); 
    initThree(); 
};

window.onresize = () => {
    var el = document.getElementById("webgl");
    renderer.setSize(el.clientWidth, el.clientHeight);
    camera.aspect = el.clientWidth / el.clientHeight;
    camera.updateProjectionMatrix();
};
</script>
</body>
</html>
